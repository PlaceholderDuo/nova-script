<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova-script Virtualizer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a1a;
  color: #aaa;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 0;
  -webkit-user-select: none; user-select: none;
}

/* ── Header bar ── */
header {
  width: 100%; background: #1e1e1e; border-bottom: 1px solid #2a2a2a;
  padding: 10px 24px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.header-left {
  display: flex; align-items: baseline; gap: 10px;
}
.header-left h1 {
  font-size: 14px; font-weight: 500; color: #ddd; letter-spacing: -0.2px;
}
.header-left .tag {
  font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 1.5px;
  border: 1px solid #2a2a2a; border-radius: 3px; padding: 1px 6px;
}

.header-center {
  display: flex; align-items: center; gap: 6px;
}
.header-center select {
  padding: 3px 6px; background: #252525; border: 1px solid #333;
  color: #bbb; border-radius: 3px; font-size: 11px; outline: none;
}
.header-center select:focus { border-color: #555; }

.header-right {
  display: flex; align-items: center; gap: 5px;
}
.header-right button {
  padding: 3px 10px; border: 1px solid transparent; border-radius: 3px;
  cursor: pointer; font-size: 10px; font-weight: 500;
  letter-spacing: 0.2px; transition: background 0.15s, border-color 0.15s;
}
.btn-connect { background: #0a2; color: #fff; border-color: #0a2; }
.btn-connect:hover { background: #0c8; }
.btn-disconnect { background: transparent; color: #b33; border-color: #3a2222; }
.btn-disconnect:hover { background: #2a1515; }
.btn-clear { background: transparent; color: #777; border-color: #333; }
.btn-clear:hover { background: #2a2a2a; color: #aaa; }
.header-right button:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

/* ── Status strip ── */
.status-strip {
  width: 100%; background: #1a1a1a; border-bottom: 1px solid #222;
  padding: 5px 24px; display: flex; gap: 18px; font-size: 10px; color: #555;
}
.status-strip .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.dot-red { background: #e33; }
.dot-green { background: #0a2; }
.dot-amber { background: #e90; }

main {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 24px;
}

.device-shell {
  position: relative;
  background: #222;
  border-radius: 6px;
  border: 1px solid #333;
  padding: 20px 24px 18px;
  display: inline-flex;
  flex-direction: column;
  gap: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  min-width: 320px;
}

/* ── Brand & model line ── */
.brand-area {
  display: flex; justify-content: center; align-items: center; gap: 0;
  margin-top: 10px;
}
.brand { font-size: 9px; color: #3a3a3a; letter-spacing: 2px; text-transform: uppercase; }
.model { font-size: 8px; color: #333; margin-left: 4px; }

/* ── Top row (circular buttons) ── */
.top-row {
  display: flex; justify-content: center; gap: 6px;
  margin: 0 auto 10px; height: 32px; align-items: flex-end;
}
.top-btn-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.top-btn {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2px solid #444; background: #333;
  transition: box-shadow 0.06s, transform 0.04s;
}
.top-btn:hover { transform: scale(1.18); border-color: #e94560; }
.top-btn:active { transform: scale(0.88); }
.top-label { font-size: 7px; color: #444; text-align: center; white-space: nowrap; max-width: 36px; overflow: hidden; }

/* ── Grid body ── */
.grid-body {
  display: flex; gap: 8px; align-items: stretch;
}
.grid-pads {
  display: grid; gap: 2px;
}
.pad {
  border-radius: 2px; cursor: pointer;
  border: 1px solid #3a3a3a;
  background: #3a3a3a;
  transition: box-shadow 0.05s, background 0.06s;
}
.pad:hover { border-color: #e94560; }
.pad:active { filter: brightness(1.6); transition: filter 0.02s; }

/* ── Right column ── */
.col-right {
  display: flex; flex-direction: column; gap: 5px; justify-content: center;
}
.col-btn-wrap {
  display: flex; align-items: center; gap: 3px;
}
.col-btn {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  border: 2px solid #444; background: #333; flex-shrink: 0;
  transition: box-shadow 0.06s, transform 0.04s;
}
.col-btn:hover { transform: scale(1.18); border-color: #e94560; }
.col-btn:active { transform: scale(0.88); }
.col-label { font-size: 7px; color: #444; min-width: 14px; }

/* ── Left column ── */
.col-left {
  display: flex; flex-direction: column; gap: 5px; justify-content: center;
}

/* ── Extra buttons (front panel) ── */
.extra-bar {
  display: flex; justify-content: center; gap: 5px; margin: 10px auto 0; flex-wrap: wrap;
}
.extra-btn {
  padding: 2px 6px; border: 1px solid #333; border-radius: 3px;
  background: #2a2a2a; color: #555; font-size: 8px; cursor: default;
}

/* ── Launchkey layout ── */
.lk-area { display: flex; flex-direction: column; gap: 8px; align-items: center; }

.knob-row { display: flex; gap: 10px; }
.knob-grp { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.knob { width: 24px; height: 24px; border-radius: 50%; background: #2a2a2a; border: 2px solid #444; cursor: pointer; position: relative; }
.knob-dot { position: absolute; top: 4px; left: 50%; width: 3px; height: 8px; background: #555; border-radius: 2px; margin-left: -1.5px; transform-origin: 1.5px 8px; }
.knob:hover .knob-dot { background: #e94560; }
.knob-lbl { font-size: 7px; color: #444; }

.lk-pads { display: flex; gap: 3px; flex-direction: column; }

.fader-row { display: flex; gap: 7px; align-items: flex-end; }
.fader-grp { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.fader { width: 14px; height: 70px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 2px; cursor: pointer; position: relative; }
.fader-cap { position: absolute; left: -1px; right: -1px; bottom: 0; height: 3px; background: #555; border-radius: 0 0 2px 2px; }
.fader:hover .fader-cap { background: #e94560; }
.fader-lbl { font-size: 7px; color: #444; }

.transport-row { display: flex; gap: 4px; }
.tport-btn { width: 22px; height: 20px; border-radius: 3px; cursor: pointer; background: #2a2a2a; border: 1px solid #3a3a3a; color: #555; font-size: 9px; display: flex; align-items: center; justify-content: center; }
.tport-btn:hover { border-color: #e94560; color: #aaa; }
.tport-btn:active { background: #3a3a3a; }

/* ── Error banner ── */
#error-banner {
  display: none; background: #3a1111; color: #f66; border: 1px solid #611; border-radius: 4px;
  padding: 6px 12px; font-size: 11px; margin-bottom: 8px; text-align: center; max-width: 500px;
}
#error-banner code { background: #611; padding: 1px 4px; border-radius: 2px; color: #f88; }

.help-text {
  margin-top: 8px; font-size: 10px; color: #444; text-align: center; max-width: 500px;
}
.help-text code { background: #252525; padding: 1px 5px; border-radius: 3px; color: #666; font-size: 10px; }
.help-text b { color: #666; font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Nova-script Virtualizer</h1>
    <span class="tag">dev</span>
  </div>
  <div class="header-center">
    <select id="device-select">
      <optgroup label="Launchpad">
        <option value="Launchpad Mini MK1" selected>Launchpad Mini MK1</option>
        <option value="Launchpad MK1">Launchpad MK1</option>
        <option value="Launchpad Mini MK3">Launchpad Mini MK3</option>
        <option value="Launchpad Pro MK3">Launchpad Pro MK3</option>
      </optgroup>
      <optgroup label="Launchkey">
        <option value="Launchkey 49 MK2">Launchkey 49 MK2</option>
      </optgroup>
    </select>
  </div>
  <div class="header-right">
    <button class="btn-connect" id="btn-connect">Connect</button>
    <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
    <button class="btn-clear" id="btn-clear">Clear</button>
  </div>
</header>

<div class="status-strip">
   <span><span class="dot dot-red" id="ws-dot"></span> <span id="ws-status">backend offline</span></span>
  <span><span class="dot dot-red" id="midi-dot"></span> <span id="midi-status">waiting</span></span>
  <span id="device-name">—</span>
</div>

<main>
  <div id="error-banner"></div>
  <div id="device-area"><div class="device-shell"><div class="brand-area"><span class="brand">Launchpad Mini</span><span class="model">MK1</span></div></div></div>
  <div class="help-text" id="help"></div>
</main>

<script>
let state = null, ws = null, reconnectTimer = null;
const WS_URL = 'ws://localhost:8766';
const $ = id => document.getElementById(id);

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  } else {
    showError('Backend not running. Start it with: ./tools/run-virtualizer.sh');
  }
}

function showError(msg) {
  const b = $('error-banner');
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(() => b.style.display = 'none', 5000);
}

function updateStatus() {
  if (state) {
    const midi = state.connected;
    $('midi-dot').className = midi ? 'dot dot-green' : 'dot dot-red';
    $('midi-status').textContent = midi ? 'midi ready' : 'midi offline';
    $('device-name').textContent = state.type || '—';
    $('btn-connect').disabled = midi;
    $('btn-disconnect').disabled = !midi;
    $('help').innerHTML = midi
      ? `Virtual MIDI ready &middot; run <code>nova-script live-show</code> to connect`
      : `Run <code>./tools/run-virtualizer.sh</code> to start backend`;
  }
}

function connect() {
  if (ws) { ws.close(); ws = null; }

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    $('ws-status').textContent = 'failed';
    $('error-banner').textContent = 'Cannot reach backend. Run: ./tools/run-virtualizer.sh';
    $('error-banner').style.display = 'block';
    return;
  }

  ws.onopen = () => {
    $('ws-status').textContent = 'connected';
    $('ws-dot').className = 'dot dot-green';
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
    $('error-banner').style.display = 'none';
    ws.send(JSON.stringify({action: 'get_state'}));
  };

  ws.onmessage = (e) => {
    state = JSON.parse(e.data);
    render();
    updateStatus();
  };

  ws.onclose = () => {
    $('ws-status').textContent = 'backend offline';
    $('ws-dot').className = 'dot dot-red';
    $('error-banner').textContent = 'Backend stopped — reconnecting in 2s...';
    $('error-banner').style.display = 'block';
    if (!reconnectTimer) reconnectTimer = setInterval(connect, 2000);
  };

  ws.onerror = () => {};
}

// ── LED color rendering ─────────────────────────────────────────────────

const LED_OFF = 'rgb(42,42,44)';

const LED_COLORS = {
  OFF:          [ 42,  42,  44],
  RED_LOW:      [ 90,  10,   0],
  RED_MED:      [165,  22,   3],
  RED_HIGH:     [245,  38,   8],
  GREEN_LOW:    [  0,  92,   6],
  GREEN_MED:    [  2, 165,  14],
  GREEN_HIGH:   [  8, 248,  25],
  AMBER_LOW:    [ 90,  50,   0],
  AMBER_MED:    [168,  98,   5],
  AMBER_HIGH:   [248, 158,  14],
  ORANGE_LOW:   [ 85,  38,   0],
  ORANGE_MED:   [160,  72,   3],
  ORANGE_HIGH:  [248, 125,   8],
  YELLOW_LOW:   [ 80,  70,   0],
  YELLOW_MED:   [150, 135,   3],
  YELLOW_HIGH:  [248, 228,   8],
  WHITE_LOW:    [ 80,  75,  70],
  WHITE_MED:    [150, 145, 138],
  WHITE_HIGH:   [248, 248, 240],
  BLUE_LOW:     [  0,   5,  75],
  BLUE_MED:     [  0,  12, 148],
  BLUE_HIGH:    [  5,  20, 248],
  PURPLE_LOW:   [ 58,   0,  58],
  PURPLE_MED:   [125,   3, 125],
  PURPLE_HIGH:  [235,   5, 235],
  CYAN_LOW:     [  0,  60,  60],
  CYAN_MED:     [  3, 128, 128],
  CYAN_HIGH:    [  5, 242, 242],
};

function ledColor(name) {
  if (LED_COLORS[name]) {
    const [r,g,b] = LED_COLORS[name];
    return `rgb(${r},${g},${b})`;
  }
  return LED_OFF;
}

function ledGlow(name) {
  if (!name || name === 'OFF') return 'none';
  const c = LED_COLORS[name] || LED_COLORS.OFF;
  const brightness = Math.max(c[0], c[1], c[2]) / 255;
  const spread = Math.round(4 + brightness * 10);
  const color = ledColor(name);
  return `0 0 ${spread}px ${color}, inset 0 0 ${Math.round(spread/2)}px ${color}`;
}

// ── Renderers ────────────────────────────────────────────────────────────

let padSize = 42;

function makePad(color, x, y) {
  const pad = document.createElement('div');
  pad.className = 'pad';
  pad.style.width = padSize + 'px';
  pad.style.height = padSize + 'px';
  pad.style.background = ledColor(color);
  pad.style.boxShadow = ledGlow(color);
  pad.title = `[${x},${y}] ${color}`;
  pad.addEventListener('click', () => send({action: 'press_pad', x, y}));
  return pad;
}

function makeRoundBtn(color, label, clickAction) {
  const wrap = document.createElement('div');
  wrap.className = label ? 'top-btn-wrap' : '';
  const btn = document.createElement('div');
  btn.className = 'top-btn';
  btn.style.background = ledColor(color);
  btn.style.boxShadow = ledGlow(color);
  btn.title = label || '';
  btn.addEventListener('click', clickAction);
  wrap.appendChild(btn);
  if (label) {
    const lbl = document.createElement('div');
    lbl.className = 'top-label';
    lbl.textContent = label;
    wrap.appendChild(lbl);
  } else {
    wrap.className = '';  // reset for no-wrap use
  }
  return wrap;
}

function makeColBtn(color, label, clickAction) {
  const wrap = document.createElement('div');
  wrap.className = 'col-btn-wrap';
  const btn = document.createElement('div');
  btn.className = 'col-btn';
  btn.style.background = ledColor(color);
  btn.style.boxShadow = ledGlow(color);
  btn.title = label || '';
  btn.addEventListener('click', clickAction);
  wrap.appendChild(btn);
  if (label) {
    const lbl = document.createElement('div');
    lbl.className = 'col-label';
    lbl.textContent = label;
    wrap.appendChild(lbl);
  }
  return wrap;
}

function renderLaunchpad() {
  const s = state;
  const shell = document.createElement('div');
  shell.className = 'device-shell';

  padSize = Math.max(16, Math.min(52, Math.floor(340 / s.grid_w)));

  // Top row buttons
  if (s.function_row && s.top_row.length) {
    const topRow = document.createElement('div');
    topRow.className = 'top-row';
    s.top_row.forEach((color, i) => {
      const label = (s.top_labels && s.top_labels[i]) || '';
      topRow.appendChild(makeRoundBtn(color, label,
        () => send({action: 'press_top', index: i})));
    });
    shell.appendChild(topRow);
  }

  // Grid body
  const body = document.createElement('div');
  body.className = 'grid-body';

  // Left col (Pro MK3)
  if (s.function_col_left) {
    const left = document.createElement('div');
    left.className = 'col-left';
    (s.left_col || []).forEach((color, i) => {
      const label = (s.left_labels && s.left_labels[i]) || '';
      left.appendChild(makeColBtn(color, label,
        () => send({action: 'press_left', index: i})));
    });
    body.appendChild(left);
  }

  // Grid
  const grid = document.createElement('div');
  grid.className = 'grid-pads';
  grid.style.gridTemplateColumns = `repeat(${s.grid_w}, ${padSize}px)`;
  grid.style.gridTemplateRows = `repeat(${s.grid_h}, ${padSize}px)`;
  for (let y = s.grid_h - 1; y >= 0; y--) {
    for (let x = 0; x < s.grid_w; x++) {
      const color = (s.grid[y] && s.grid[y][x]) || 'OFF';
      grid.appendChild(makePad(color, x, y));
    }
  }
  body.appendChild(grid);

  // Right col
  if (s.function_col && s.right_col.length) {
    const right = document.createElement('div');
    right.className = 'col-right';
    s.right_col.forEach((color, i) => {
      const label = (s.right_labels && s.right_labels[i]) || '';
      right.appendChild(makeColBtn(color, label,
        () => send({action: 'press_right', index: i})));
    });
    body.appendChild(right);
  }

  shell.appendChild(body);

  // Extra buttons (front panel)
  if (s.extra_buttons && s.extra_buttons.length) {
    const bar = document.createElement('div');
    bar.className = 'extra-bar';
    s.extra_buttons.forEach(label => {
      const btn = document.createElement('div');
      btn.className = 'extra-btn';
      btn.textContent = label;
      bar.appendChild(btn);
    });
    shell.appendChild(bar);
  }

  // Brand
  if (s.device_brand || s.model_line) {
    const brandArea = document.createElement('div');
    brandArea.className = 'brand-area';
    const brand = document.createElement('span');
    brand.className = 'brand';
    brand.textContent = s.device_brand || '';
    brandArea.appendChild(brand);
    if (s.model_line) {
      const model = document.createElement('span');
      model.className = 'model';
      model.textContent = s.model_line;
      brandArea.appendChild(model);
    }
    shell.appendChild(brandArea);
  }

  return shell;
}

function renderLaunchkey() {
  const s = state;
  const shell = document.createElement('div');
  shell.className = 'device-shell';

  const area = document.createElement('div');
  area.className = 'lk-area';

  // Knobs
  if (s.num_knobs) {
    const row = document.createElement('div');
    row.className = 'knob-row';
    for (let i = 0; i < s.num_knobs; i++) {
      const grp = document.createElement('div');
      grp.className = 'knob-grp';
      const knob = document.createElement('div');
      knob.className = 'knob';
      const dot = document.createElement('div');
      dot.className = 'knob-dot';
      knob.appendChild(dot);
      knob.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const r = knob.getBoundingClientRect();
        const angle = Math.atan2(e.clientY - (r.top+r.height/2), e.clientX - (r.left+r.width/2)) * 180/Math.PI + 90;
        const val = Math.round(Math.max(0, Math.min(127, (angle / 270) * 127)));
        dot.style.transform = `rotate(${Math.round(angle)}deg)`;
        send({action: 'knob', index: i, value: val});
      });
      grp.appendChild(knob);
      const lbl = document.createElement('div');
      lbl.className = 'knob-lbl';
      lbl.textContent = `K${i+1}`;
      grp.appendChild(lbl);
      row.appendChild(grp);
    }
    area.appendChild(row);
  }

  // Pads
  padSize = Math.max(20, Math.min(48, Math.floor(360 / s.grid_w)));
  const padArea = document.createElement('div');
  padArea.className = 'lk-pads';
  const padGrid = document.createElement('div');
  padGrid.className = 'grid-pads';
  padGrid.style.gridTemplateColumns = `repeat(${s.grid_w}, ${padSize}px)`;
  padGrid.style.gridTemplateRows = `repeat(${s.grid_h}, ${padSize}px)`;
  for (let y = s.grid_h - 1; y >= 0; y--) {
    for (let x = 0; x < s.grid_w; x++) {
      const color = (s.grid[y] && s.grid[y][x]) || 'OFF';
      padGrid.appendChild(makePad(color, x, y));
    }
  }
  padArea.appendChild(padGrid);
  area.appendChild(padArea);

  // Faders
  if (s.num_faders) {
    const row = document.createElement('div');
    row.className = 'fader-row';
    for (let i = 0; i < Math.min(8, s.num_faders); i++) {
      const grp = document.createElement('div');
      grp.className = 'fader-grp';
      const fader = document.createElement('div');
      fader.className = 'fader';
      const cap = document.createElement('div');
      cap.className = 'fader-cap';
      fader.appendChild(cap);
      fader.addEventListener('click', (e) => {
        const r = fader.getBoundingClientRect();
        const pct = 1 - (e.clientY - r.top) / r.height;
        const val = Math.round(Math.max(0, Math.min(127, pct * 127)));
        cap.style.bottom = Math.round(pct * 100) + '%';
        send({action: 'fader', index: i, value: val});
      });
      grp.appendChild(fader);
      const lbl = document.createElement('div');
      lbl.className = 'fader-lbl';
      lbl.textContent = `F${i+1}`;
      grp.appendChild(lbl);
      row.appendChild(grp);
    }
    if (s.num_faders > 8) {
      const grp = document.createElement('div');
      grp.className = 'fader-grp';
      const fader = document.createElement('div');
      fader.className = 'fader';
      fader.style.width = '18px';
      const cap = document.createElement('div');
      cap.className = 'fader-cap';
      fader.appendChild(cap);
      fader.addEventListener('click', (e) => {
        const r = fader.getBoundingClientRect();
        const pct = 1 - (e.clientY - r.top) / r.height;
        const val = Math.round(Math.max(0, Math.min(127, pct * 127)));
        cap.style.bottom = Math.round(pct * 100) + '%';
        send({action: 'fader', index: 8, value: val});
      });
      grp.appendChild(fader);
      const lbl = document.createElement('div');
      lbl.className = 'fader-lbl';
      lbl.textContent = 'MST';
      grp.appendChild(lbl);
      row.appendChild(grp);
    }
    area.appendChild(row);
  }

  // Transport
  if (s.has_transport) {
    const row = document.createElement('div');
    row.className = 'transport-row';
    const labels = s.transport_labels || ['◀◀','▶▶','◼','▶','↺','●','Tr◀','Tr▶'];
    for (let i = 0; i < 8; i++) {
      const btn = document.createElement('div');
      btn.className = 'tport-btn';
      btn.textContent = labels[i] || '';
      btn.addEventListener('click', () => send({action: 'transport', index: i}));
      row.appendChild(btn);
    }
    area.appendChild(row);
  }

  shell.appendChild(area);

  // Brand
  if (s.device_brand || s.model_line) {
    const ba = document.createElement('div');
    ba.className = 'brand-area';
    const b = document.createElement('span');
    b.className = 'brand';
    b.textContent = s.device_brand || '';
    ba.appendChild(b);
    if (s.model_line) {
      const m = document.createElement('span');
      m.className = 'model';
      m.textContent = s.model_line;
      ba.appendChild(m);
    }
    ba.style.marginTop = '8px';
    shell.appendChild(ba);
  }

  return shell;
}

function render() {
  if (!state) return;
  const area = $('device-area');
  area.innerHTML = '';

  const isLaunchkey = state.has_transport || (state.grid_h <= 2 && state.num_knobs > 0);
  const shell = isLaunchkey ? renderLaunchkey() : renderLaunchpad();
  area.appendChild(shell);
}

// ── Controls ─────────────────────────────────────────────────────────────

$('device-select').addEventListener('change', (e) => {
  send({action: 'switch_device', profile: e.target.value});
});

$('btn-connect').addEventListener('click', () => send({action: 'connect'}));
$('btn-disconnect').addEventListener('click', () => send({action: 'disconnect'}));
$('btn-clear').addEventListener('click', () => send({action: 'clear'}));

// Keyboard: 1-8 for top row, Shift+1-8 for right col
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = parseInt(e.key);
  if (isNaN(k) || k < 1 || k > 8) return;
  if (e.shiftKey) send({action: 'press_right', index: k - 1});
  else send({action: 'press_top', index: k - 1});
});

connect();
</script>
</body>
</html>
