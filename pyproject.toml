[project]
name = "nova-script"
version = "0.1.0"
description = "Unified Novation controller scripting environment and performance controller"
requires-python = ">=3.11"
dependencies = [
    "python-rtmidi>=1.5",
    "python-osc>=1.8",
    "textual>=0.50",
    "pyyaml>=6.0",
]

[project.scripts]
nova-script = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
